<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>YouTube Live Chat Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <h1>YouTube Live Chat Filter</h1>
    </header>

    <!-- 自分のチャンネル設定セクション -->
    <section id="self-section" class="section">
      <h2>自分のチャンネル</h2>
      <div id="self-not-registered" class="self-register">
        <p class="info-text">チャンネルを登録してください</p>
        <div class="input-group">
          <input type="text" id="self-input" placeholder="URL / @handle / UCxxxx">
          <button id="self-save-btn" class="btn btn-primary">保存</button>
        </div>
        <p class="hint">例: https://youtube.com/@yourhandle</p>
      </div>
      <div id="self-registered" class="self-display hidden">
        <div class="user-info">
          <span id="self-channel-id" class="channel-id"></span>
        </div>
        <button id="self-change-btn" class="btn btn-small">変更</button>
      </div>
    </section>

    <!-- 状態表示セクション -->
    <section id="status-section" class="section">
      <div id="status-invalid" class="status-message hidden">
        <span class="status-icon">⚠️</span>
        <span id="status-reason">このページは対象外です</span>
      </div>
      <div id="status-replay" class="status-message status-info hidden">
        <span class="status-icon">📼</span>
        <span>チャットリプレイを検出しました</span>
      </div>
      <div id="status-no-self" class="status-message hidden">
        <span class="status-icon">👤</span>
        <span>自分のチャンネルを登録してください</span>
      </div>
      <div id="status-no-owner" class="status-message hidden">
        <span class="status-icon">❓</span>
        <span>配信者を検出できませんでした</span>
      </div>
    </section>

    <!-- フィルタトグルセクション -->
    <section id="filter-section" class="section hidden">
      <div class="toggle-container">
        <span id="toggle-label" class="toggle-label">自分以外を非表示</span>
        <label class="toggle">
          <input type="checkbox" id="filter-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="owner-info" class="owner-info">
        <span class="label">配信者:</span>
        <span id="owner-channel-id" class="channel-id"></span>
      </div>
    </section>

    <!-- 直近の発言者セクション -->
    <section id="speakers-section" class="section hidden">
      <h2>直近の発言者</h2>
      <div id="speakers-list" class="user-list">
        <p class="empty-message">発言者がいません</p>
      </div>
    </section>

    <!-- 許可ユーザーセクション (ホワイトリスト用) -->
    <section id="allowed-section" class="section hidden">
      <h2>許可ユーザー</h2>
      <div id="allowed-list" class="user-list">
        <p class="empty-message">許可ユーザーがいません</p>
      </div>
    </section>

    <!-- ブロックユーザーセクション (ブラックリスト用) -->
    <section id="blocked-section" class="section hidden">
      <h2>ブロックユーザー</h2>
      <div id="blocked-list" class="user-list">
        <p class="empty-message">ブロック中のユーザーはいません</p>
      </div>
    </section>

    <!-- 設定セクション -->
    <section id="settings-section" class="section">
      <h2>設定</h2>
      <div class="setting-item">
        <label class="setting-label">フィルタ方式</label>
        <select id="setting-filter-mode">
          <option value="whitelist">ホワイトリスト (自分・配信者以外を非表示)</option>
          <option value="blacklist">ブラックリスト (指定ユーザーのみ非表示)</option>
        </select>
      </div>
      <div class="setting-item" id="moderator-setting-item">
        <label class="checkbox-label">
          <input type="checkbox" id="setting-moderator">
          <span>モデレーターを配信側として扱う</span>
        </label>
      </div>
      <div class="setting-item">
        <label class="setting-label">起動時の動作</label>
        <select id="setting-startup">
          <option value="alwaysOff">毎回OFFで開始</option>
          <option value="restoreLast">前回の状態を復元</option>
        </select>
      </div>
    </section>

    <!-- フッター -->
    <footer class="footer">
      <span class="version" id="app-version">v1.1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
